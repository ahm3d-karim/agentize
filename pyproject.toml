[project]
name = "agentize-cli"
version = "0.8.0"
description = "Generate AGENTS.md from a repo's actual config — evidence-based, no guessing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Ahmad Karim", email = "28020258@lums.edu.pk" },
]
keywords = [
    "agents",
    "AGENTS.md",
    "cli",
    "codebase",
    "documentation",
    "developer-tools",
    "ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ahm3d-karim/agentize"
Repository = "https://github.com/ahm3d-karim/agentize"
Issues = "https://github.com/ahm3d-karim/agentize/issues"

[project.scripts]
agentize = "agentize:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["agentize.py"]
