[project]
name = "agentize"
version = "0.7.1"
description = "Generate AGENTS.md from a repo's actual config — evidence-based, no guessing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
agentize = "agentize:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
