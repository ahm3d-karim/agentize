name: CI
on: [push, pull_request]

jobs:
  test:
    name: test (${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run unittest suite
        run: python -m unittest discover -s tests

  wheel-smoke:
    name: wheel build + install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: python -m pip wheel . -w dist
      - name: Show wheel contents
        run: python -m zipfile -l dist/*.whl
      - name: Install into fresh venv and smoke-test
        run: |
          python -m venv venv
          venv/bin/python -m pip install --no-deps dist/*.whl
          venv/bin/agentize --version | grep "0.8.0"
