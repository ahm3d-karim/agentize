[project]
name = "fixture-ml"
version = "0.1.0"
description = "A fake Python package for testing agentize."
requires-python = ">=3.10"
dependencies = ["pandas", "numpy"]

[project.scripts]
train = "fixture_ml.train:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
